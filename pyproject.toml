[project]
name = "stock-forecast"
version = "0.1.0"
description = "A股当日走势预测系统: 多源数据融合 + ML模型 + LLM辅助研判"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare>=1.18,<1.19",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "lightgbm>=4.7,<5",
    "xgboost>=2.0,<4",
    "scikit-learn>=1.4",
    "openai>=1.30",
    "pydantic-settings>=2.2",
    "rich>=13",
    "streamlit>=1.35,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# 显式固定规则集 = ruff 0.4 时代的默认集(E4/E7/E9/F)。
# 新版 ruff 会漂移默认规则(DTZ/BLE/SIM/RUF...), 显式声明保证 lint 口径跨版本一致,
# 也与 CI(Phase 7.3) 的确定性要求对齐。注意本项目有意使用 naive 本地时间
# (容器 TZ=Asia/Shanghai), 不应按 DTZ 规则"修复"。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
