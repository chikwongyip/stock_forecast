[project]
name = "stock-forecast"
version = "0.1.0"
description = "A股当日走势预测系统: 多源数据融合 + ML模型 + LLM辅助研判"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare>=1.18,<1.19",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "openai>=1.30",
    "pydantic-settings>=2.2",
    "rich>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
