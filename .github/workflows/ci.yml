# Phase 7.3: CI — ruff + pytest(离线单测, 不依赖网络/LLM/真实数据)
name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 pyproject requires-python(>=3.12,<3.13)和 Dockerfile 一致
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖(与镜像同口径: 包本体 + pytest/ruff)
        run: |
          python -m pip install --upgrade pip
          pip install . pytest ruff

      - name: ruff(E4/E7/E9/F, line-length 100, 规则集固定于 pyproject)
        run: ruff check src tests

      - name: pytest(离线)
        run: pytest -q
